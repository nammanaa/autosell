name: Build Fabric Example Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # BƯỚC ĐẶC BIỆT: Di chuyển các file wrapper nằm sai chỗ vào đúng thư mục gradle/wrapper/
      - name: Fix Web Upload Structure
        run: |
          mkdir -p gradle/wrapper
          [ -f gradle-wrapper.jar ] && mv gradle-wrapper.jar gradle/wrapper/
          [ -f gradle-wrapper.properties ] && mv gradle-wrapper.properties gradle/wrapper/
          chmod +x gradlew

      - name: Build Mod JAR
        run: ./gradlew build -x test --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true"

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-Output
          path: build/libs/
