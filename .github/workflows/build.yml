name: Build Fabric Example Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Nâng cấp lên v5 để tương thích hoàn toàn với hệ thống Ubuntu mới của GitHub
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # SỬA LỖI WEB UPLOAD: Di chuyển file vào đúng thư mục gradle/wrapper/
      - name: Fix Web Upload Structure
        run: |
          mkdir -p gradle/wrapper
          if [ -f gradle-wrapper.properties ]; then
            mv gradle-wrapper.properties gradle/wrapper/
          fi
          if [ -f gradle-wrapper.jar ]; then
            mv gradle-wrapper.jar gradle/wrapper/
          fi
          chmod +x gradlew

      # THIẾT LẬP GRADLE VÀ ÉP DÙNG PHIÊN BẢN 8.10 (Bản siêu ổn định với Fabric Loom 1.7)
      - name: Setup and Update Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # CHẠY LỆNH BUILD VỚI CỜ BỎ QUA KIỂM TRA ĐỘC LẬP
      - name: Build Mod JAR
        run: ./gradlew build -x test --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true -Dorg.gradle.welcome=never"

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-Output
          path: build/libs/

