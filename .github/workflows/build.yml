name: Build Fabric Example Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cài đặt cứng bản Gradle 8.10 vào hệ thống máy ảo
      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # SỬA LỖI WEB UPLOAD: Di chuyển file vào đúng thư mục gradle/wrapper/
      - name: Fix Web Upload Structure
        run: |
          mkdir -p gradle/wrapper
          if [ -f gradle-wrapper.properties ]; then
            mv gradle-wrapper.properties gradle/wrapper/
          fi
          if [ -f gradle-wrapper.jar ]; then
            mv gradle-wrapper.jar gradle/wrapper/
          fi
          chmod +x gradlew

      # LỆNH ĐÓNG GÓI CHUẨN CỦA FABRIC LOOM (Tự động quét tài nguyên và re-map)
      - name: Build Mod JAR
        run: gradle build -x test --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true -Dorg.gradle.welcome=never"

      # ĐẨY FILE MOD ĐÃ BUILD LÊN MỤC ARTIFACT
      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-Output
          path: build/libs/
