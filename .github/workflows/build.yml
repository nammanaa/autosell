name: Build Fabric Example Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cài đặt cứng bản Gradle 8.10 vào hệ thống máy ảo
      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      # Dùng lệnh 'gradle' trực tiếp thay vì './gradlew' để bỏ qua file properties cũ
      - name: Build Mod JAR
        run: gradle build -x test --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3g -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.parallel=true -Dorg.gradle.welcome=never"

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-Output
          path: build/libs/
